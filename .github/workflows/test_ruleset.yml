name: Test Apply Ruleset
on: 
  workflow_dispatch: # これでボタンが表示されるようになります

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      administration: write # ルールセットの作成に必須
      contents: read
    
    steps:
      - uses: actions/checkout@v4

      - name: Apply Ruleset via GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 既存の同名ルールセットがある場合に備えて、一度作成を試みる
          # 既に存在する場合はエラーになりますが、まずは作成できるか確認します
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/${{ github.repository }}/rulesets \
            --input .github/rulesets/main-protection.json